[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strat1-gold-options"
version = "0.1.0"
description = "Provider-independent Gold options flow and dealer positioning engine"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "fastapi>=0.115",
  "pydantic>=2.8",
  "metaapi-cloud-sdk>=29.1.1,<30",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["strat*"]
exclude = ["mobile*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
