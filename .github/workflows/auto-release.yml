name: Pips-life Automatic Release

on:
  workflow_run:
    workflows: ["Pips-life Android"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: pips-life-auto-release
  cancel-in-progress: false

jobs:
  prepare-release:
    # Only gate on the upstream build result here. Branch/recursion checks are
    # performed as explicit steps so a bad condition cannot silently skip the job.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate triggering Android build
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          set -euo pipefail
          test "$HEAD_BRANCH" = "main" || {
            echo "Android build completed successfully, but branch '$HEAD_BRANCH' is not main; no release will be created."
            exit 0
          }
          case "$HEAD_MESSAGE" in
            "chore(release): prepare"*)
              echo "Release-preparation commit detected; no second release will be created."
              exit 0
              ;;
          esac
          echo "Eligible successful Android build on main."

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine next release number
        id: next
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v*.*.*' --sort=-version:refname | head -n1 || true)"
          if [[ -n "$latest_tag" ]]; then
            latest_version="${latest_tag#v}"
          else
            latest_version="0.2.2"
          fi

          IFS=. read -r major minor patch <<< "$latest_version"
          next_version="$major.$minor.$((patch + 1))"

          latest_code="$(python3 - <<'PY'
          import json, re, subprocess
          rows=json.loads(subprocess.check_output(
              ['gh','release','list','--limit','100','--json','tagName'], text=True))
          codes=[]
          for row in rows:
              tag=row.get('tagName')
              if not tag:
                  continue
              try:
                  assets=json.loads(subprocess.check_output(
                      ['gh','release','view',tag,'--json','assets'], text=True)).get('assets',[])
              except subprocess.CalledProcessError:
                  continue
              for asset in assets:
                  m=re.search(r'pips-life-[0-9]+\\.[0-9]+\\.[0-9]+-(\\d+)\\.apk$', asset.get('name',''))
                  if m:
                      codes.append(int(m.group(1)))
          print(max(codes) if codes else 4)
          PY
          )"

          next_code=$((latest_code + 1))
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "code=$next_code" >> "$GITHUB_OUTPUT"

      - name: Prevent duplicate release tag
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ steps.next.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update release properties
        if: steps.guard.outputs.already_released != 'true'
        run: |
          printf 'versionName=%s\nversionCode=%s\n' \
            "${{ steps.next.outputs.version }}" \
            "${{ steps.next.outputs.code }}" > mobile/release.properties

      - name: Commit release version
        if: steps.guard.outputs.already_released != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/release.properties
          git diff --cached --quiet && exit 0
          git commit -m "chore(release): prepare Pips-life ${{ steps.next.outputs.version }} (${{ steps.next.outputs.code }})"
          git push origin main

      - name: Create numbered release tag
        if: steps.guard.outputs.already_released != 'true'
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          tag="v${{ steps.next.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; nothing to do."
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
