name: Pips-life Automatic Release

on:
  workflow_run:
    workflows: ["Pips-life Android"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pips-life-auto-release
  cancel-in-progress: false

jobs:
  prepare-release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate triggering Android build
        if: github.event_name == 'workflow_run'
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          set -euo pipefail
          test "$HEAD_BRANCH" = "main"
          case "$HEAD_MESSAGE" in
            "chore(release): prepare"*) echo "Release-preparation commit intentionally does not publish."; exit 1 ;;
          esac

      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0

      - name: Read tested release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test -f mobile/release.properties
          version_name="$(sed -n 's/^versionName=//p' mobile/release.properties)"
          version_code="$(sed -n 's/^versionCode=//p' mobile/release.properties)"
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid versionName'; exit 1; }
          [[ "$version_code" =~ ^[0-9]+$ ]] || { echo 'Invalid versionCode'; exit 1; }
          echo "version=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v$version_name" >> "$GITHUB_OUTPUT"

      - name: Prevent duplicate release tag
        id: guard
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          tag="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT
          fi

      - name: Dispatch signed release workflow
        if: steps.guard.outputs.already_released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run mobile-release.yml \
            --ref "${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}" \
            -f version_name="${{ steps.version.outputs.version }}" \
            -f version_code="${{ steps.version.outputs.code }}"
