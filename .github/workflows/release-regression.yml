name: Pips-life Release Regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'mobile/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'mobile/**'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  release-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify updater source contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=mobile/app/src/main/java/life/pips/strat1/UpdateGateActivity.kt
          grep -Fq 'private const val RELEASE_LATEST_PATH = "/api/app/release/latest"' "$FILE"
          grep -Fq 'private const val RELEASE_DOWNLOAD_PATH = "/api/app/release/download?asset="' "$FILE"
          grep -Fq 'versionCode > BuildConfig.VERSION_CODE.toLong()' "$FILE"
          grep -Fq 'showUpdateDialog(versionName, assetId, releaseUrl)' "$FILE"
          grep -Fq 'BuildConfig.BACKEND_BASE_URL' "$FILE"
          grep -Fq 'buildConfigField("String", "BACKEND_BASE_URL", "\\"https://strat-1.vercel.app\\"")' mobile/app/build.gradle.kts

      - name: Compile Android debug build
        working-directory: mobile
        run: gradle --no-daemon assembleDebug

      - name: Verify latest GitHub release contract
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, urllib.request

          release = json.loads(subprocess.check_output([
              'gh', 'release', 'view', '--json', 'tagName,name,isDraft,isPrerelease,assets'
          ], text=True))
          assert release['isDraft'] is False, 'latest release must not be a draft'
          assert release['isPrerelease'] is False, 'latest release must not be a prerelease'
          tag = release['tagName']
          assert tag.startswith('v'), f'invalid release tag: {tag}'
          assets = {a['name']: a for a in release['assets']}
          apk = next((n for n in assets if n.endswith('.apk') and n.startswith('pips-life-')), None)
          assert apk, 'latest release is missing its Pips-life APK'
          sha = apk + '.sha256'
          assert sha in assets, 'latest release is missing its SHA-256 sidecar'
          assert 'release-manifest.json' in assets, 'latest release is missing release-manifest.json'

          manifest_url = assets['release-manifest.json']['browserDownloadUrl']
          req = urllib.request.Request(manifest_url, headers={'Authorization': f"Bearer {subprocess.check_output(['gh','auth','token'], text=True).strip()}", 'Accept': 'application/octet-stream'})
          manifest = json.load(urllib.request.urlopen(req))
          assert manifest['tag'] == tag
          assert manifest['apk'] == apk
          assert isinstance(manifest['versionCode'], int) and manifest['versionCode'] > 0
          assert manifest['versionName']
          assert manifest['sha256'].startswith('sha256:')
          assert assets[apk].get('digest') == manifest['sha256'], 'APK digest does not match manifest'
          print(f"Release regression OK: {tag} / {manifest['versionName']} / versionCode {manifest['versionCode']}")
          PY

      - name: Verify Vercel release gateway contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            https://strat-1.vercel.app/api/app/release/latest \
            -o /tmp/latest.json
          python3 - <<'PY'
          import json, re
          with open('/tmp/latest.json') as f: data=json.load(f)
          required=['tag','name','versionName','versionCode','assetId','assetName','assetSize','digest','releaseUrl']
          missing=[k for k in required if k not in data]
          assert not missing, f'missing gateway fields: {missing}'
          assert re.fullmatch(r'v\d+\.\d+\.\d+', data['tag'])
          assert re.fullmatch(r'\d+\.\d+\.\d+', data['versionName'].split('\\n')[0])
          assert isinstance(data['versionCode'], int) and data['versionCode'] > 0
          assert data['assetName'].endswith('.apk') and data['assetName'].startswith('pips-life-')
          assert isinstance(data['assetSize'], int) and data['assetSize'] > 0
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', data['digest'])
          assert data['releaseUrl'].startswith('https://github.com/Pips-life/Strat.1/releases/tag/')
          print(f"Gateway regression OK: {data['tag']} / versionCode {data['versionCode']}")
          PY
