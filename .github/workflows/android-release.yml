name: Pips-life Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version matching mobile/app/build.gradle.kts, e.g. 0.2.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pips-life-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' mobile/app/build.gradle.kts | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' mobile/app/build.gradle.kts | head -1)
          test "$APP_VERSION" = "$VERSION" || { echo "Release $VERSION does not match app version $APP_VERSION"; exit 1; }
          test -n "$VERSION_CODE"
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: gradle -p mobile --no-daemon clean :app:assembleRelease --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="mobile/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Prepare numbered APK
        shell: bash
        run: |
          cp mobile/app/build/outputs/apk/release/app-release.apk \
            "Pips-life-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk"

      - name: Publish numbered GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Pips-life ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})
          generate_release_notes: true
          files: Pips-life-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk
          fail_on_unmatched_files: true
          body: |
            ## Pips-life ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})

            Numbered Android release for Pips-life.

            APK SHA-256: `${{ env.APK_SHA256 }}`

            ### Update mechanism
            Existing Pips-life installations check the public GitHub Releases feed for the latest stable release. When a newer version is found, the app prompts the user to download the APK from the GitHub release and then launches Android's package installer.

            ### Release numbering
            - Git tag: `vMAJOR.MINOR.PATCH`
            - Android `versionName`: `MAJOR.MINOR.PATCH`
            - Android `versionCode`: monotonically increasing integer
            - APK asset: `Pips-life-MAJOR.MINOR.PATCH-versionCode.apk`
