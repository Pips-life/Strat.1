name: Pips-life Android Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate release number
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_VERSION="$(grep '^versionName=' release.properties | cut -d= -f2)"
          RELEASE_CODE="$(grep '^versionCode=' release.properties | cut -d= -f2)"
          test "$TAG_VERSION" = "$RELEASE_VERSION" || { echo "Tag $TAG_VERSION does not match release.properties $RELEASE_VERSION"; exit 1; }
          [[ "$RELEASE_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "versionCode must be a positive integer"; exit 1; }
          echo "Release: $RELEASE_VERSION (versionCode $RELEASE_CODE)"

      - name: Assemble release APK
        working-directory: mobile
        run: gradle --no-daemon :app:assembleRelease -PreleaseVersion="$(grep '^versionName=' release.properties | cut -d= -f2)" -PreleaseVersionCode="$(grep '^versionCode=' release.properties | cut -d= -f2)"

      - name: Verify APK
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          sha256sum "$APK"
          echo "Verified APK: $APK"

      - name: Publish numbered GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Pips-life ${{ github.ref_name }}
          generate_release_notes: true
          files: mobile/app/build/outputs/apk/release/app-release.apk
