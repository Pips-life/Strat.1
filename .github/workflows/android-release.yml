name: Pips-life Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate release tag against app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test -n "$VERSION_NAME"
          test "$VERSION_NAME" = "$TAG_VERSION" || { echo "Tag $TAG_VERSION does not match app versionName $VERSION_NAME"; exit 1; }
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Read version for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "VERSION_NAME=$(sed -n 's/.*versionName = \"\([^\"]*\)\".*/\1/p' app/build.gradle.kts | head -1)" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          echo "APK_SIZE=$(stat -c%s "$APK")" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Rename APK
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Pips-life-${VERSION_NAME}.apk"

      - name: Create numbered GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Pips-life ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})
          generate_release_notes: true
          files: mobile/app/build/outputs/apk/release/Pips-life-${{ env.VERSION_NAME }}.apk
          fail_on_unmatched_files: true
          body: |
            ## Pips-life ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})

            Install the attached Android APK on an existing Pips-life installation.

            APK SHA-256: `${{ env.APK_SHA256 }}`

            Release numbering is controlled by `mobile/app/build.gradle.kts` and the `vMAJOR.MINOR.PATCH` tag. The app's built-in updater checks GitHub's latest stable release and offers the APK when a newer version is available.
