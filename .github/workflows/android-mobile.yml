name: Pips-life Android

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-mobile.yml'
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Read mobile version
        id: version
        working-directory: mobile
        run: |
          echo "version_name=$(sed -n 's/^versionName=//p' release.properties)" >> "$GITHUB_OUTPUT"
          echo "version_code=$(sed -n 's/^versionCode=//p' release.properties)" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: mobile
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK metadata
        env:
          EXPECTED_NAME: ${{ steps.version.outputs.version_name }}
          EXPECTED_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          APK="mobile/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/pipslife-badging.txt
          grep -q "package: name='life.pipslife.mobile'" /tmp/pipslife-badging.txt
          grep -q "versionCode='$EXPECTED_CODE'" /tmp/pipslife-badging.txt
          grep -q "versionName='$EXPECTED_NAME'" /tmp/pipslife-badging.txt
          grep -q "application-label:'Pips-life'" /tmp/pipslife-badging.txt
          grep -q "ic_launcher.xml" /tmp/pipslife-badging.txt

      - name: Upload built APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pips-life-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}-debug
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Verify APK installation and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r mobile/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant life.pipslife.mobile android.permission.POST_NOTIFICATIONS || true
            adb shell monkey -p life.pipslife.mobile 1
            sleep 5
            adb shell pidof life.pipslife.mobile

      # This workflow is the Android release gate for automatic numbered releases.
