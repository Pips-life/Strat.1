name: Pips-life Runner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-runner:
    name: Build and publish MetaApi streaming runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test runner package
        run: |
          python -m pip install -e '.[test]'
          pytest -q
          python -m py_compile runner/server.py
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runner/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/pips-life/pips-life-runner:latest
            ghcr.io/pips-life/pips-life-runner:${{ github.sha }}
      - name: Runner image smoke test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker run -d --name pips-life-runner-smoke -p 18080:10000 -e PIPSLIFE_BOT_CONTROL_TOKEN=smoke-token ghcr.io/pips-life/pips-life-runner:${{ github.sha }}
          trap 'docker logs pips-life-runner-smoke || true; docker rm -f pips-life-runner-smoke || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health; then echo; exit 0; fi
            sleep 1
          done
          echo 'Runner health endpoint did not become ready.'
          exit 1

  demo-verify:
    name: Verify Strategy 002 on configured MetaApi demo account
    needs: build-runner
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[demo-verify]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start real demo runner
        env:
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          METAAPI_ACCOUNT_ID: ${{ secrets.METAAPI_ACCOUNT_ID }}
          CONTROL_TOKEN: ${{ secrets.PIPSLIFE_BOT_CONTROL_TOKEN }}
          SYMBOL: ${{ vars.PIPSLIFE_SYMBOL }}
          EXECUTION_VOLUME: ${{ vars.PIPSLIFE_EXECUTION_VOLUME }}
          LIVE_TRADING: ${{ vars.PIPSLIFE_LIVE_TRADING_ENABLED }}
          TRAIL_PIPS: ${{ vars.PIPSLIFE_STRATEGY002_TRAIL_PIPS }}
        run: |
          set -euo pipefail
          test -n "$METAAPI_TOKEN"
          test -n "$METAAPI_ACCOUNT_ID"
          if [ -z "${CONTROL_TOKEN:-}" ]; then CONTROL_TOKEN="demo-control-$GITHUB_RUN_ID"; fi
          SYMBOL="${SYMBOL:-XAUUSD}"
          TRAIL_PIPS="${TRAIL_PIPS:-100}"
          LIVE_TRADING="${LIVE_TRADING:-true}"
          LIVE_TRADING="$(printf '%s' "$LIVE_TRADING" | tr '[:upper:]' '[:lower:]')"
          test "$LIVE_TRADING" = "true"
          test -n "$EXECUTION_VOLUME"
          python - <<'PY'
          import os
          v=os.environ['EXECUTION_VOLUME'].strip()
          try: x=float(v)
          except ValueError: raise SystemExit(f'Invalid PIPSLIFE_EXECUTION_VOLUME: {v!r}; configure one positive numeric lot size.')
          if x <= 0: raise SystemExit('PIPSLIFE_EXECUTION_VOLUME must be positive')
          print('Execution volume configuration is valid.')
          PY
          docker run -d --name pips-life-demo-verify -p 18081:10000 \
            -e METAAPI_TOKEN="$METAAPI_TOKEN" \
            -e METAAPI_ACCOUNT_ID="$METAAPI_ACCOUNT_ID" \
            -e PIPSLIFE_BOT_CONTROL_TOKEN="$CONTROL_TOKEN" \
            -e PIPSLIFE_SYMBOL="$SYMBOL" \
            -e PIPSLIFE_EXECUTION_VOLUME="$EXECUTION_VOLUME" \
            -e PIPSLIFE_LIVE_TRADING_ENABLED="$LIVE_TRADING" \
            -e PIPSLIFE_STRATEGY002_TRAIL_PIPS="$TRAIL_PIPS" \
            ghcr.io/pips-life/pips-life-runner:${{ github.sha }}
          trap 'docker logs pips-life-demo-verify || true; docker rm -f pips-life-demo-verify || true' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18081/health >/tmp/health.json; then break; fi
            sleep 1
          done
          python - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          assert h.get('ok') is True, h
          assert h.get('metaapiConfigured') is True, h
          assert h.get('liveTradingEnabled') is True, h
          assert h.get('executionVolumeConfigured') is True, h
          print('Runner configuration verified.')
          PY
          AUTH="Authorization: Bearer $CONTROL_TOKEN"
          curl --fail --silent -X POST http://127.0.0.1:18081/ \
            -H "$AUTH" -H 'Content-Type: application/json' \
            --data "{\"action\":\"start\",\"strategy\":\"002\",\"accountId\":\"$METAAPI_ACCOUNT_ID\"}" >/tmp/start.json
          cat /tmp/start.json; echo
          echo 'Following runner event stream for up to 180 seconds (no market-state polling).'
          set +e
          timeout --signal=TERM 180s docker logs -f --since 1s pips-life-demo-verify 2>&1 | tee /tmp/runner-events.log
          set -e
          curl --fail --silent -X POST http://127.0.0.1:18081/ \
            -H "$AUTH" -H 'Content-Type: application/json' \
            --data "{\"action\":\"stop\",\"accountId\":\"$METAAPI_ACCOUNT_ID\"}" >/tmp/stop.json || true
          cat /tmp/stop.json || true; echo
          grep -q 'STREAM_CONNECTED' /tmp/runner-events.log || { echo 'Demo verification failed: streaming connection was not observed.'; exit 1; }
          grep -q 'TICK_STREAM_ACTIVE' /tmp/runner-events.log || { echo 'Demo verification failed: no live symbol tick reached Strategy 002.'; exit 1; }
          if grep -q 'ORDER_ACK strategy=002' /tmp/runner-events.log; then
            echo 'DEMO TRADE VERIFIED: Strategy 002 received a broker order acknowledgement.'
          elif grep -q 'ORDER_ERROR strategy=002' /tmp/runner-events.log || grep -q 'ORDER_ERROR' /tmp/runner-events.log; then
            echo 'Demo verification failed: Strategy 002 reached execution but broker order returned an error.'
            exit 1
          else
            echo 'Demo verification failed: live ticks arrived but Strategy 002 produced no broker order acknowledgement during the verification window.'
            exit 1
          fi
# Streaming demo verification is intentionally enabled by the commit message above.
