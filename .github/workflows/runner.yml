name: Pips-life Runner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-runner:
    name: Build and publish MetaApi streaming runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test runner package
        run: |
          python -m pip install -e '.[test]'
          pytest -q
          python -m py_compile runner/server.py

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runner/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/pips-life-runner:latest
            ghcr.io/${{ github.repository_owner }}/pips-life-runner:${{ github.sha }}

      - name: Runner image smoke test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker run -d --name pips-life-runner-smoke -p 18080:8080 \
            -e PIPSLIFE_BOT_CONTROL_TOKEN=smoke-token \
            ghcr.io/${{ github.repository_owner }}/pips-life-runner:${{ github.sha }}
          trap 'docker logs pips-life-runner-smoke || true; docker rm -f pips-life-runner-smoke || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo 'Runner health endpoint did not become ready.'
          exit 1
