name: Pips-life numbered Android release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Read and validate release numbering
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep -E 'versionName = ' mobile/app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode = ' mobile/app/build.gradle.kts | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          test "$VERSION_NAME" = "$TAG_VERSION"
          test "$VERSION_CODE" -ge 1
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Pips-life release: $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Require release signing configuration
        shell: bash
        env:
          PIPS_KEYSTORE_B64: ${{ secrets.PIPS_LIFE_RELEASE_KEYSTORE_BASE64 }}
          PIPS_KEYSTORE_PASSWORD: ${{ secrets.PIPS_LIFE_RELEASE_KEYSTORE_PASSWORD }}
          PIPS_KEY_ALIAS: ${{ secrets.PIPS_LIFE_RELEASE_KEY_ALIAS }}
          PIPS_KEY_PASSWORD: ${{ secrets.PIPS_LIFE_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$PIPS_KEYSTORE_B64" || (echo 'Missing PIPS_LIFE_RELEASE_KEYSTORE_BASE64 secret' && exit 1)
          test -n "$PIPS_KEYSTORE_PASSWORD" || (echo 'Missing PIPS_LIFE_RELEASE_KEYSTORE_PASSWORD secret' && exit 1)
          test -n "$PIPS_KEY_ALIAS" || (echo 'Missing PIPS_LIFE_RELEASE_KEY_ALIAS secret' && exit 1)
          test -n "$PIPS_KEY_PASSWORD" || (echo 'Missing PIPS_LIFE_RELEASE_KEY_PASSWORD secret' && exit 1)
          echo "$PIPS_KEYSTORE_B64" | base64 --decode > mobile/pips-life-release.keystore
          test -s mobile/pips-life-release.keystore

      - name: Build signed release APK
        env:
          PIPS_LIFE_KEYSTORE_FILE: ${{ github.workspace }}/mobile/pips-life-release.keystore
          PIPS_LIFE_KEYSTORE_PASSWORD: ${{ secrets.PIPS_LIFE_RELEASE_KEYSTORE_PASSWORD }}
          PIPS_LIFE_KEY_ALIAS: ${{ secrets.PIPS_LIFE_RELEASE_KEY_ALIAS }}
          PIPS_LIFE_KEY_PASSWORD: ${{ secrets.PIPS_LIFE_RELEASE_KEY_PASSWORD }}
        run: gradle -p mobile :app:assembleRelease --stacktrace

      - name: Verify APK
        run: |
          test -f mobile/app/build/outputs/apk/release/app-release.apk
          test -s mobile/app/build/outputs/apk/release/app-release.apk

      - name: Create numbered GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Pips-life ${{ steps.version.outputs.version_name }} (build ${{ steps.version.outputs.version_code }})
          generate_release_notes: true
          files: mobile/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

      - name: Remove temporary signing material
        if: always()
        run: rm -f mobile/pips-life-release.keystore
