name: Pips-life Release

on:
  push:
    branches: [main]
    paths:
      - mobile/app/**
      - mobile/build.gradle.kts
      - mobile/settings.gradle.kts
      - mobile/gradle/**
      - mobile/gradlew
      - mobile/gradlew.bat
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version, e.g. 0.2.16
        required: true
        type: string
      version_code:
        description: Monotonic Android version code
        required: true
        type: string
      source_sha:
        description: Exact tested commit SHA to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pips-life-release-${{ inputs.version_name || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Configure Git identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ -n '${{ inputs.version_name }}' ]; then
            VERSION_NAME='${{ inputs.version_name }}'
            VERSION_CODE='${{ inputs.version_code }}'
            SOURCE_SHA='${{ inputs.source_sha }}'
          else
            test -f mobile/release.properties
            CURRENT_NAME="$(sed -n 's/^versionName=//p' mobile/release.properties)"
            CURRENT_CODE="$(sed -n 's/^versionCode=//p' mobile/release.properties)"
            CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
            COMMIT_MESSAGE="$(git log -1 --pretty=%B)"
            if printf '%s\n' "$COMMIT_MESSAGE" | grep -q '\[release-now\]'; then
              VERSION_NAME="$CURRENT_NAME"
              VERSION_CODE="$CURRENT_CODE"
              SOURCE_SHA="$(git rev-parse HEAD)"
            elif [ "$CHANGED_FILES" = ".github/workflows/release.yml" ]; then
              # A workflow-only maintenance commit must not manufacture a duplicate release.
              VERSION_NAME="$CURRENT_NAME"
              VERSION_CODE="$CURRENT_CODE"
              SOURCE_SHA="$(git rev-parse HEAD)"
            else
              IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_NAME"
              VERSION_NAME="$MAJOR.$MINOR.$((PATCH + 1))"
              VERSION_CODE="$((CURRENT_CODE + 1))"
              printf 'versionName=%s\nversionCode=%s\n' "$VERSION_NAME" "$VERSION_CODE" > mobile/release.properties
              git add mobile/release.properties
              git commit -m "chore: release Pips-life $VERSION_NAME [skip ci]"
              git push origin HEAD:main
              SOURCE_SHA="$(git rev-parse HEAD)"
            fi
          fi
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Configure signing
        env:
          KEYSTORE_B64: ${{ secrets.PIPS_LIFE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PIPS_LIFE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PIPS_LIFE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PIPS_LIFE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"; test -n "$STORE_PASSWORD"; test -n "$KEY_ALIAS"; test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pips-life-release.keystore"
          echo "PIPS_LIFE_KEYSTORE_PATH=$RUNNER_TEMP/pips-life-release.keystore" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build and verify signed APK
        working-directory: mobile
        env:
          PIPS_LIFE_KEYSTORE_PASSWORD: ${{ secrets.PIPS_LIFE_KEYSTORE_PASSWORD }}
          PIPS_LIFE_KEY_ALIAS: ${{ secrets.PIPS_LIFE_KEY_ALIAS }}
          PIPS_LIFE_KEY_PASSWORD: ${{ secrets.PIPS_LIFE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf 'versionName=%s\nversionCode=%s\n' '${{ steps.meta.outputs.version_name }}' '${{ steps.meta.outputs.version_code }}' > release.properties
          # The agreed Pips-life blue is the luminous app cyan used throughout the UI.
          sed -i 's/private val Blue = Color(0xFF5D8CFF)/private val Blue = Color(0xFF25D9FF)/' app/src/main/java/life/pips/strat1/MainActivity.kt
          # Close the broker/server result list immediately after a server is selected.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/life/pips/strat1/MainActivity.kt')
          s = p.read_text()
          old = 'var searchStarted by remember { mutableStateOf(false) }'
          new = 'var searchStarted by remember { mutableStateOf(false) }; var searchOpen by remember { mutableStateOf(true) }'
          assert old in s, 'search state declaration not found'
          s = s.replace(old, new, 1)
          old = 'LaunchedEffect(brokerQuery) { val query = brokerQuery.trim();'
          new = 'LaunchedEffect(brokerQuery, searchOpen) { if (!searchOpen) return@LaunchedEffect; val query = brokerQuery.trim();'
          assert old in s, 'search effect not found'
          s = s.replace(old, new, 1)
          old = 'onValueChange = { value -> brokerQuery = value; if (value.isBlank()) {'
          new = 'onValueChange = { value -> searchOpen = true; brokerQuery = value; if (value.isBlank()) {'
          assert old in s, 'search input handler not found'
          s = s.replace(old, new, 1)
          old = 'onClick = { server = s.serverName; brokerQuery = s.brokerName }'
          new = 'onClick = { server = s.serverName; brokerQuery = s.brokerName; servers = emptyList(); searchStarted = false; searchOpen = false }'
          assert old in s, 'server selection handler not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          gradle --no-daemon clean assembleRelease --stacktrace
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/pips-badging.txt
          grep -q "package: name='life.pipslife.mobile'" /tmp/pips-badging.txt
          grep -q "versionCode='${{ steps.meta.outputs.version_code }}'" /tmp/pips-badging.txt
          grep -q "versionName='${{ steps.meta.outputs.version_name }}'" /tmp/pips-badging.txt
          grep -q "application-label:'Pips-life'" /tmp/pips-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          NAME="pips-life-${{ steps.meta.outputs.version_name }}-${{ steps.meta.outputs.version_code }}.apk"
          cp "$APK" "$GITHUB_WORKSPACE/$NAME"
          sha256sum "$GITHUB_WORKSPACE/$NAME" > "$GITHUB_WORKSPACE/$NAME.sha256"
          SHA="$(cut -d' ' -f1 "$GITHUB_WORKSPACE/$NAME.sha256")"
          printf '{"app":"Pips-life","versionName":"%s","versionCode":%s,"tag":"v%s","apk":"%s","sha256":"sha256:%s"}\n' '${{ steps.meta.outputs.version_name }}' '${{ steps.meta.outputs.version_code }}' '${{ steps.meta.outputs.version_name }}' "$NAME" "$SHA" > "$GITHUB_WORKSPACE/release-manifest.json"
      - name: Publish numbered release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v${{ steps.meta.outputs.version_name }}'
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists; nothing to publish"; exit 0; fi
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then echo "Tag $TAG already exists; nothing to publish"; exit 0; fi
          git tag -a "$TAG" -m "Pips-life ${{ steps.meta.outputs.version_name }} (${{ steps.meta.outputs.version_code }})" '${{ steps.meta.outputs.source_sha }}'
          git push origin "$TAG"
          gh release create "$TAG" "$GITHUB_WORKSPACE/pips-life-${{ steps.meta.outputs.version_name }}-${{ steps.meta.outputs.version_code }}.apk" "$GITHUB_WORKSPACE/pips-life-${{ steps.meta.outputs.version_name }}-${{ steps.meta.outputs.version_code }}.apk.sha256" "$GITHUB_WORKSPACE/release-manifest.json" --title "Pips-life ${{ steps.meta.outputs.version_name }} (${{ steps.meta.outputs.version_code }})" --notes "Official Pips-life Android release."
