name: Restore MainActivity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'run restore-mainactivity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore previous MainActivity and apply targeted nullable-session fix
        shell: bash
        run: |
          set -euo pipefail
          git checkout 0160aa1e90bd0b8b60389d8eebee278208eda11b -- mobile/app/src/main/java/life/pips/strat1/MainActivity.kt
          python - <<'PY'
          from pathlib import Path
          p = Path('mobile/app/src/main/java/life/pips/strat1/MainActivity.kt')
          s = p.read_text()
          old = '''        selected = strategy\n        pendingSelection = strategy\n        message = "Activating Strategy $strategy…"\n        busy = true\n        scope.launch {'''
          new = '''        selected = strategy\n        pendingSelection = strategy\n        message = "Activating Strategy $strategy…"\n        busy = true\n        val activeSession = session ?: run { busy = false; return }\n        scope.launch {'''
          if old not in s:
              raise SystemExit('target block not found')
          s = s.replace(old, new, 1)
          s = s.replace('api.botCommand(session, "select", strategy)', 'api.botCommand(activeSession, "select", strategy)', 1)
          s = s.replace('api.botCommand(session, "start", strategy)', 'api.botCommand(activeSession, "start", strategy)', 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/app/src/main/java/life/pips/strat1/MainActivity.kt
          git commit -m 'fix: restore MainActivity and nullable session handling'
          git push origin HEAD:main
      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/restore-mainactivity.yml
          git commit -m 'chore: remove temporary restore workflow'
          git push origin HEAD:main
