name: Pips-life Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version, e.g. 0.2.2'
        required: true
        type: string
      version_code:
        description: 'Monotonic Android version code, e.g. 4'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pips-life-mobile-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform/build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Resolve and validate release numbering
        id: version
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_NAME=$(grep '^versionName=' release.properties | cut -d= -f2)
          SOURCE_CODE=$(grep '^versionCode=' release.properties | cut -d= -f2)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION_NAME="${{ inputs.version_name }}"
            VERSION_CODE="${{ inputs.version_code }}"
          else
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            VERSION_CODE="$SOURCE_CODE"
            test "$VERSION_NAME" = "$SOURCE_NAME"
          fi
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid versionName'; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo 'Invalid versionCode'; exit 1; }
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Pips-life $VERSION_NAME ($VERSION_CODE)"

      - name: Check versionCode is newer than the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          TAGS=$(gh release list --limit 20 --json tagName,isDraft,isPrerelease --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName')
          if [[ -z "$TAGS" ]]; then
            echo "No previous release found; this is the starting point."
            exit 0
          fi
          while read -r TAG; do
            [[ -z "$TAG" ]] && continue
            ASSET_CODES=$(gh release view "$TAG" --json assets --jq '.assets[].name' | sed -nE 's/^Pips-life-[0-9]+\.[0-9]+\.[0-9]+-([0-9]+)\.apk$/\1/p')
            for CODE in $ASSET_CODES; do
              if (( VERSION_CODE <= CODE )); then
                echo "versionCode $VERSION_CODE must be greater than published release code $CODE ($TAG)"
                exit 1
              fi
            done
          done <<< "$TAGS"

      - name: Configure stable release signing
        env:
          KEYSTORE_B64: ${{ secrets.PIPSLIFE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo 'Missing repository secret: PIPSLIFE_KEYSTORE_BASE64'; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pips-life-release.jks"
          test -s "$RUNNER_TEMP/pips-life-release.jks"

      - name: Build signed release APK
        working-directory: mobile
        env:
          PIPS_LIFE_KEYSTORE_PATH: ${{ runner.temp }}/pips-life-release.jks
          PIPS_LIFE_KEYSTORE_PASSWORD: ${{ secrets.PIPSLIFE_KEYSTORE_PASSWORD }}
          PIPS_LIFE_KEY_ALIAS: ${{ secrets.PIPSLIFE_KEY_ALIAS }}
          PIPS_LIFE_KEY_PASSWORD: ${{ secrets.PIPSLIFE_KEY_PASSWORD }}
        run: |
          test -n "$PIPS_LIFE_KEYSTORE_PASSWORD"
          test -n "$PIPS_LIFE_KEY_ALIAS"
          test -n "$PIPS_LIFE_KEY_PASSWORD"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            printf 'versionName=%s\nversionCode=%s\n' '${{ steps.version.outputs.version_name }}' '${{ steps.version.outputs.version_code }}' > release.properties
          fi
          gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify APK metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/pips-badging.txt
          grep -q "package: name='life.pipslife.mobile'" /tmp/pips-badging.txt
          grep -q "versionCode='${{ steps.version.outputs.version_code }}'" /tmp/pips-badging.txt
          grep -q "versionName='${{ steps.version.outputs.version_name }}'" /tmp/pips-badging.txt
          grep -q "application-label:'Pips-life'" /tmp/pips-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Prepare numbered release assets
        shell: bash
        run: |
          NAME="Pips-life-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk"
          cp mobile/app/build/outputs/apk/release/app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          cat > release-manifest.json <<EOF
          {
            "app": "Pips-life",
            "versionName": "${{ steps.version.outputs.version_name }}",
            "versionCode": ${{ steps.version.outputs.version_code }},
            "tag": "${{ steps.version.outputs.tag }}",
            "apk": "$NAME",
            "sha256": "$(cut -d' ' -f1 "$NAME.sha256")"
          }
          EOF

      - name: Publish numbered GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "Pips-life-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk" \
            "Pips-life-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.sha256" \
            release-manifest.json \
            --title "Pips-life ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})" \
            --notes "Official Pips-life Android release ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})."

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" --json tagName,name,isDraft,isPrerelease,assets
