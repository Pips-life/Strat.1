name: Pips-life Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version, e.g. 0.2.2'
        required: true
        type: string
      version_code:
        description: 'Monotonic Android version code, e.g. 4'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform/build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION_NAME="${{ inputs.version_name }}"
            VERSION_CODE="${{ inputs.version_code }}"
            TAG="v${VERSION_NAME}"
          else
            TAG="${GITHUB_REF_NAME#v}"
            VERSION_NAME="$TAG"
            VERSION_CODE="$(echo "$TAG" | awk -F. '{print (($1*1000000)+($2*1000)+$3)}')"
          fi
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid version name'; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo 'Invalid version code'; exit 1; }
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Stamp Android version
        working-directory: mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          import re
          s = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = ${{ steps.version.outputs.version_code }}', s, count=1)
          s = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "${{ steps.version.outputs.version_name }}"', s, count=1)
          p.write_text(s)
          PY

      - name: Ensure Gradle wrapper
        working-directory: mobile
        run: |
          test -x ./gradlew
          ./gradlew --version

      - name: Build release APK
        working-directory: mobile
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK and generate release manifest
        shell: bash
        run: |
          APK="mobile/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          NAME="pips-life-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk"
          cp "$APK" "$NAME"
          SHA="$(sha256sum "$NAME" | awk '{print $1}')"
          cat > release-manifest.json <<EOF
          {
            "app": "Pips-life",
            "versionName": "${{ steps.version.outputs.version_name }}",
            "versionCode": ${{ steps.version.outputs.version_code }},
            "tag": "${{ steps.version.outputs.tag }}",
            "apk": "$NAME",
            "sha256": "$SHA"
          }
          EOF
          cat release-manifest.json

      - name: Verify APK metadata
        shell: bash
        run: |
          APK="pips-life-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='life.pipslife.mobile'" /tmp/badging.txt
          grep -q "versionCode='${{ steps.version.outputs.version_code }}'" /tmp/badging.txt
          grep -q "versionName='${{ steps.version.outputs.version_name }}'" /tmp/badging.txt

      - name: Publish numbered GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "pips-life-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk" \
            release-manifest.json \
            --title "Pips-life ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})" \
            --generate-notes
