name: Pips-life Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version matching mobile/release.properties, e.g. 0.2.2'
        required: true
        type: string
      version_code:
        description: 'Monotonic Android version code, e.g. 4'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pips-life-mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform/build tools
        run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Resolve and validate release number
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION_NAME="${{ inputs.version_name }}"
            VERSION_CODE="${{ inputs.version_code }}"
          else
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            VERSION_CODE="$(sed -n 's/^versionCode=//p' mobile/release.properties)"
          fi
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid version name'; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo 'Invalid version code'; exit 1; }
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Stamp release.properties for manual release
        if: github.event_name == 'workflow_dispatch'
        working-directory: mobile
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: printf 'versionName=%s\nversionCode=%s\n' "$VERSION_NAME" "$VERSION_CODE" > release.properties

      - name: Validate tagged release against release.properties
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          FILE_VERSION=$(sed -n 's/^versionName=//p' mobile/release.properties)
          FILE_CODE=$(sed -n 's/^versionCode=//p' mobile/release.properties)
          test "$FILE_VERSION" = "${{ steps.version.outputs.version_name }}"
          test "$FILE_CODE" = "${{ steps.version.outputs.version_code }}"

      - name: Require stable release signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.PIPS_LIFE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PIPS_LIFE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PIPS_LIFE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PIPS_LIFE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing PIPS_LIFE_KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing PIPS_LIFE_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing PIPS_LIFE_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing PIPS_LIFE_KEY_PASSWORD'; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pips-life-release.keystore"
          test -s "$RUNNER_TEMP/pips-life-release.keystore"
          echo "PIPS_LIFE_KEYSTORE_PATH=$RUNNER_TEMP/pips-life-release.keystore" >> "$GITHUB_ENV"

      - name: Check Android project
        working-directory: mobile
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f release.properties
          test -f app/build.gradle.kts
          gradle --version

      - name: Build signed release APK
        working-directory: mobile
        env:
          PIPS_LIFE_KEYSTORE_PATH: ${{ env.PIPS_LIFE_KEYSTORE_PATH }}
          PIPS_LIFE_KEYSTORE_PASSWORD: ${{ secrets.PIPS_LIFE_KEYSTORE_PASSWORD }}
          PIPS_LIFE_KEY_ALIAS: ${{ secrets.PIPS_LIFE_KEY_ALIAS }}
          PIPS_LIFE_KEY_PASSWORD: ${{ secrets.PIPS_LIFE_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease --stacktrace

      - name: Locate and verify APK
        shell: bash
        run: |
          APK="mobile/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/pips-badging.txt
          grep -q "package: name='life.pipslife.mobile'" /tmp/pips-badging.txt
          grep -q "versionCode='${{ steps.version.outputs.version_code }}'" /tmp/pips-badging.txt
          grep -q "versionName='${{ steps.version.outputs.version_name }}'" /tmp/pips-badging.txt
          grep -q "application-label:'Pips-life'" /tmp/pips-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          NAME="pips-life-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          SHA=$(cut -d' ' -f1 "$NAME.sha256")
          cat > release-manifest.json <<EOF
          {"app":"Pips-life","versionName":"${{ steps.version.outputs.version_name }}","versionCode":${{ steps.version.outputs.version_code }},"tag":"${{ steps.version.outputs.tag }}","apk":"$NAME","sha256":"$SHA"}
          EOF

      - name: Verify release numbering against existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release list --limit 1 --json tagName,isDraft,isPrerelease > /tmp/latest-release.json; then
            python3 - <<'PY'
          import json, re, os, subprocess
          rows=json.load(open('/tmp/latest-release.json'))
          if not rows: raise SystemExit(0)
          tag=rows[0]['tagName']
          try:
              latest=int(subprocess.check_output(['gh','release','view',tag,'--json','assets','-q','.assets[]?.name'],text=True).split('-')[-1].split('.')[0])
          except Exception:
              latest=0
          if latest and int(os.environ['VERSION_CODE']) <= latest:
              raise SystemExit(f"versionCode {os.environ['VERSION_CODE']} must exceed previous release code {latest}")
          PY
          fi

      - name: Publish numbered GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "pips-life-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk" \
            "pips-life-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk.sha256" \
            release-manifest.json \
            --title "Pips-life ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})" \
            --generate-notes

      - name: Verify published release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ steps.version.outputs.tag }}" --json tagName,name,assets
