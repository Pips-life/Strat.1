name: Pips-life Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version, e.g. 0.2.2'
        required: true
        type: string
      version_code:
        description: 'Monotonic Android version code, e.g. 4'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pips-life-mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform/build tools
        run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Resolve and validate release number
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION_NAME="${{ inputs.version_name }}"
            VERSION_CODE="${{ inputs.version_code }}"
          else
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            FILE_VERSION="$(sed -n 's/^versionName=//p' mobile/release.properties)"
            VERSION_CODE="$(sed -n 's/^versionCode=//p' mobile/release.properties)"
            [[ "$VERSION_NAME" == "$FILE_VERSION" ]] || { echo "Tag $VERSION_NAME does not match mobile/release.properties $FILE_VERSION"; exit 1; }
          fi
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid version name'; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo 'Invalid version code'; exit 1; }
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Stamp release.properties
        working-directory: mobile
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: printf 'versionName=%s\nversionCode=%s\n' "$VERSION_NAME" "$VERSION_CODE" > release.properties

      - name: Require stable release signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.PIPS_LIFE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PIPS_LIFE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PIPS_LIFE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PIPS_LIFE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo 'Missing PIPS_LIFE_KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing PIPS_LIFE_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing PIPS_LIFE_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing PIPS_LIFE_KEY_PASSWORD'; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pips-life-release.keystore"
          test -s "$RUNNER_TEMP/pips-life-release.keystore"
          echo "PIPSLIFE_KEYSTORE_FILE=$RUNNER_TEMP/pips-life-release.keystore" >> "$GITHUB_ENV"
          echo "PIPSLIFE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "PIPSLIFE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "PIPSLIFE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Check Android project
        working-directory: mobile
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f release.properties
          test -f app/build.gradle.kts
          gradle --version

      - name: Build signed release APK
        working-directory: mobile
        run: gradle --no-daemon clean assembleRelease --stacktrace

      - name: Locate and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/pips-badging.txt
          grep -q "package: name='life.pipslife.mobile'" /tmp/pips-badging.txt
          grep -q "versionCode='${{ steps.version.outputs.version_code }}'" /tmp/pips-badging.txt
          grep -q "versionName='${{ steps.version.outputs.version_name }}'" /tmp/pips-badging.txt
          grep -q "application-label:'Pips-life'" /tmp/pips-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          NAME="pips-life-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          SHA=$(cut -d' ' -f1 "$NAME.sha256")
          printf '{"app":"Pips-life","versionName":"%s","versionCode":%s,"tag":"%s","apk":"%s","sha256":"%s"}\n' "${{ steps.version.outputs.version_name }}" "${{ steps.version.outputs.version_code }}" "${{ steps.version.outputs.tag }}" "$NAME" "$SHA" > release-manifest.json

      - name: Verify release numbering against existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release list --limit 1 --json tagName > /tmp/latest-release.json; then exit 0; fi
          python3 - <<'PY'
          import json, os, re, subprocess
          rows=json.load(open('/tmp/latest-release.json'))
          if not rows: raise SystemExit(0)
          tag=rows[0]['tagName']
          names=subprocess.check_output(['gh','release','view',tag,'--json','assets','-q','.assets[]?.name'],text=True).splitlines()
          codes=[]
          for name in names:
              m=re.search(r'pips-life-[0-9]+\.[0-9]+\.[0-9]+-(\d+)\.apk$',name)
              if m: codes.append(int(m.group(1)))
          if codes and int(os.environ['VERSION_CODE']) <= max(codes):
              raise SystemExit(f"versionCode {os.environ['VERSION_CODE']} must exceed previous release code {max(codes)}")
          PY

      - name: Publish numbered GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: pips-life-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "$NAME" \
            "$NAME.sha256" \
            release-manifest.json \
            --title "Pips-life ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})" \
            --notes "Version: ${{ steps.version.outputs.version_name }}\nVersionCode: ${{ steps.version.outputs.version_code }}\n\nOfficial Pips-life Android release. The app checks this GitHub Releases feed for newer versions." \
            --target "${{ github.sha }}"

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${{ steps.version.outputs.tag }}" --json tagName,name,assets
          test "$(gh release view "${{ steps.version.outputs.tag }}" --json assets --jq '[.assets[].name | select(endswith(".apk"))] | length')" -eq 1
