name: Pips-life Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version, e.g. 0.2.2'
        required: true
        type: string
      version_code:
        description: 'Monotonic Android version code, e.g. 4'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pips-life-mobile-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform/build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION_NAME="${{ inputs.version_name }}"
            VERSION_CODE="${{ inputs.version_code }}"
          else
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            # Deterministic monotonic code for tag-based releases.
            VERSION_CODE="$(echo "$VERSION_NAME" | awk -F. '{print (($1*1000000)+($2*1000)+$3)}')"
          fi
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid version name'; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo 'Invalid version code'; exit 1; }
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Check release numbering
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view --json assets >/tmp/latest-release.json 2>/dev/null; then
            echo "No previous GitHub release; numbering check starts at this release."
            exit 0
          fi
          python3 - <<'PY'
          import json, re, os
          data=json.load(open('/tmp/latest-release.json'))
          codes=[]
          for asset in data.get('assets',[]):
              m=re.search(r'pips-life-[0-9]+\.[0-9]+\.[0-9]+-(\d+)\.apk$', asset.get('name',''))
              if m: codes.append(int(m.group(1)))
          if codes and int(os.environ['VERSION_CODE']) <= max(codes):
              raise SystemExit(f"versionCode {os.environ['VERSION_CODE']} must be greater than previous release code {max(codes)}")
          PY

      - name: Stamp Android version
        working-directory: mobile
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {os.environ["VERSION_CODE"]}', s, count=1)
          s = re.sub(r'versionName\s*=\s*"[^"]+"', f'versionName = "{os.environ["VERSION_NAME"]}"', s, count=1)
          p.write_text(s)
          PY

      - name: Check Android project
        working-directory: mobile
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          gradle --version

      - name: Build release APK
        working-directory: mobile
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Locate and verify APK
        shell: bash
        run: |
          APK="$(find mobile/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK" && test -s "$APK"
          NAME="pips-life-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk"
          cp "$APK" "$NAME"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$NAME" | tee /tmp/pips-badging.txt
          grep -q "package: name='life.pipslife.mobile'" /tmp/pips-badging.txt
          grep -q "versionCode='${{ steps.version.outputs.version_code }}'" /tmp/pips-badging.txt
          grep -q "versionName='${{ steps.version.outputs.version_name }}'" /tmp/pips-badging.txt
          sha256sum "$NAME" > "$NAME.sha256"
          cat > release-manifest.json <<EOF
          {
            "app": "Pips-life",
            "versionName": "${{ steps.version.outputs.version_name }}",
            "versionCode": ${{ steps.version.outputs.version_code }},
            "tag": "${{ steps.version.outputs.tag }}",
            "apk": "$NAME",
            "sha256": "$(cut -d' ' -f1 "$NAME.sha256")"
          }
          EOF
          cat release-manifest.json

      - name: Publish numbered GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "pips-life-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk" \
            "pips-life-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk.sha256" \
            release-manifest.json \
            --title "Pips-life ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})" \
            --generate-notes

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" --json tagName,name,assets
