name: Pips-life Numbered Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.2.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Validate version numbering
        working-directory: mobile
        shell: bash
        run: |
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          VERSION_CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | head -1 | awk '{print $3}')
          test "$VERSION_NAME" = "${{ steps.release.outputs.version }}"
          echo "Building Pips-life $VERSION_NAME ($VERSION_CODE)"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Decode release signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.PIPSLIFE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing PIPSLIFE_KEYSTORE_BASE64 repository secret'; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pips-life-release.jks"

      - name: Build signed release APK
        working-directory: mobile
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/pips-life-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.PIPSLIFE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PIPSLIFE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PIPSLIFE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"; test -n "$KEY_ALIAS"; test -n "$KEY_PASSWORD"
          gradle --no-daemon --stacktrace assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify APK package and numbering
        shell: bash
        run: |
          APK="mobile/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/pipslife-release-badging.txt
          grep -q "package: name='life.pipslife.mobile'" /tmp/pipslife-release-badging.txt
          grep -q "versionName='${{ steps.release.outputs.version }}'" /tmp/pipslife-release-badging.txt
          grep -q "versionCode='${VERSION_CODE}'" /tmp/pipslife-release-badging.txt
          grep -q "application-label:'Pips-life'" /tmp/pipslife-release-badging.txt

      - name: Rename release APK
        shell: bash
        run: cp mobile/app/build/outputs/apk/release/app-release.apk "Pips-life-${{ steps.release.outputs.version }}-${VERSION_CODE}.apk"

      - name: Generate SHA-256 checksum
        shell: bash
        run: sha256sum "Pips-life-${{ steps.release.outputs.version }}-${VERSION_CODE}.apk" > "Pips-life-${{ steps.release.outputs.version }}-${VERSION_CODE}.sha256"

      - name: Publish numbered GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Pips-life ${{ steps.release.outputs.version }} (${{ env.VERSION_CODE }})
          body: |
            ## Pips-life ${{ steps.release.outputs.version }} (${{ env.VERSION_CODE }})

            Official numbered Android release.

            - App: Pips-life
            - Version: ${{ steps.release.outputs.version }}
            - Version code: ${{ env.VERSION_CODE }}
            - APK: signed release build
            - Updates: the app checks this GitHub Releases feed for newer version codes.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            Pips-life-${{ steps.release.outputs.version }}-${{ env.VERSION_CODE }}.apk
            Pips-life-${{ steps.release.outputs.version }}-${{ env.VERSION_CODE }}.sha256
