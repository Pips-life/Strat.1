name: Pips-life Numbered Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.2.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then TAG="${{ inputs.tag }}"; else TAG="${GITHUB_REF_NAME}"; fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Validate version numbering
        working-directory: mobile
        shell: bash
        run: |
          VERSION_NAME=$(grep -o 'versionName=[^[:space:]]*' release.properties | cut -d= -f2)
          VERSION_CODE=$(grep -o 'versionCode=[0-9]*' release.properties | cut -d= -f2)
          test "$VERSION_NAME" = "${{ steps.release.outputs.version }}"
          test "$VERSION_CODE" -gt 0
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Pips-life $VERSION_NAME ($VERSION_CODE)"

      - name: Decode stable release keystore
        env:
          KEYSTORE_B64: ${{ secrets.PIPSLIFE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing PIPSLIFE_KEYSTORE_BASE64'; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pips-life-release.jks"

      - name: Build signed release APK
        working-directory: mobile
        env:
          PIPS_LIFE_KEYSTORE_PATH: ${{ runner.temp }}/pips-life-release.jks
          PIPS_LIFE_KEYSTORE_PASSWORD: ${{ secrets.PIPSLIFE_KEYSTORE_PASSWORD }}
          PIPS_LIFE_KEY_ALIAS: ${{ secrets.PIPSLIFE_KEY_ALIAS }}
          PIPS_LIFE_KEY_PASSWORD: ${{ secrets.PIPSLIFE_KEY_PASSWORD }}
        run: |
          test -n "$PIPS_LIFE_KEYSTORE_PASSWORD"
          test -n "$PIPS_LIFE_KEY_ALIAS"
          test -n "$PIPS_LIFE_KEY_PASSWORD"
          gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK package and numbering
        shell: bash
        run: |
          APK="mobile/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/pipslife-release-badging.txt
          grep -q "package: name='life.pipslife.mobile'" /tmp/pipslife-release-badging.txt
          grep -q "versionName='${{ steps.release.outputs.version }}'" /tmp/pipslife-release-badging.txt
          grep -q "versionCode='${VERSION_CODE}'" /tmp/pipslife-release-badging.txt
          grep -q "application-label:'Pips-life'" /tmp/pipslife-release-badging.txt

      - name: Rename APK and create checksum
        shell: bash
        run: |
          cp mobile/app/build/outputs/apk/release/app-release.apk "Pips-life-${{ steps.release.outputs.version }}-${VERSION_CODE}.apk"
          sha256sum "Pips-life-${{ steps.release.outputs.version }}-${VERSION_CODE}.apk" > "Pips-life-${{ steps.release.outputs.version }}-${VERSION_CODE}.sha256"

      - name: Publish numbered GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Pips-life ${{ steps.release.outputs.version }} (${{ env.VERSION_CODE }})
          body: |
            ## Pips-life ${{ steps.release.outputs.version }} (${{ env.VERSION_CODE }})

            Official numbered Android release.

            - App: Pips-life
            - Version: ${{ steps.release.outputs.version }}
            - Version code: ${{ env.VERSION_CODE }}
            - APK: signed release build
            - Update channel: GitHub Releases
          draft: false
          prerelease: false
          make_latest: true
          files: |
            Pips-life-${{ steps.release.outputs.version }}-${{ env.VERSION_CODE }}.apk
            Pips-life-${{ steps.release.outputs.version }}-${{ env.VERSION_CODE }}.sha256
