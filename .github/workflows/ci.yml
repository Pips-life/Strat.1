name: Pips-life CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pips-life-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - name: Validate live runner syntax
        run: python -m py_compile runner/server.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build and verify debug APK
        working-directory: mobile
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/pips-badging.txt
          grep -q "package: name='life.pipslife.mobile'" /tmp/pips-badging.txt
          grep -q "application-label:'Pips-life'" /tmp/pips-badging.txt

  release:
    name: Build signed update-safe Android release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, backend, android]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Resolve next release number
        id: version
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' --sort=-version:refname | head -n1)"
          if [[ -z "$latest" ]]; then
            next="0.1.0"
          else
            current="${latest#v}"
            IFS=. read -r major minor patch <<< "$current"
            next="${major}.${minor}.$((patch + 1))"
          fi
          version_code="$(printf '%s' "$next" | awk -F. '{print $3}')"
          [[ "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release version'; exit 1; }
          [[ "$version_code" =~ ^[0-9]+$ ]] || { echo 'Invalid Android version code'; exit 1; }
          echo "version_name=$next" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
      - name: Stamp release.properties
        working-directory: mobile
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: printf 'versionName=%s\nversionCode=%s\n' "$VERSION_NAME" "$VERSION_CODE" > release.properties
      - name: Require stable release signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.PIPS_LIFE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PIPS_LIFE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PIPS_LIFE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PIPS_LIFE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo 'Missing PIPS_LIFE_KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing PIPS_LIFE_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing PIPS_LIFE_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing PIPS_LIFE_KEY_PASSWORD'; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pips-life-release.keystore"
          test -s "$RUNNER_TEMP/pips-life-release.keystore"
          echo "PIPS_LIFE_KEYSTORE_PATH=$RUNNER_TEMP/pips-life-release.keystore" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: mobile
        env:
          PIPS_LIFE_KEYSTORE_PATH: ${{ env.PIPS_LIFE_KEYSTORE_PATH }}
          PIPS_LIFE_KEYSTORE_PASSWORD: ${{ secrets.PIPS_LIFE_KEYSTORE_PASSWORD }}
          PIPS_LIFE_KEY_ALIAS: ${{ secrets.PIPS_LIFE_KEY_ALIAS }}
          PIPS_LIFE_KEY_PASSWORD: ${{ secrets.PIPS_LIFE_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease --stacktrace
      - name: Verify signed release artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/pips-badging.txt
          grep -q "package: name='life.pipslife.mobile'" /tmp/pips-badging.txt
          grep -q "application-label:'Pips-life'" /tmp/pips-badging.txt
          grep -q "versionCode='${{ steps.version.outputs.version_code }}'" /tmp/pips-badging.txt
          grep -q "versionName='${{ steps.version.outputs.version_name }}'" /tmp/pips-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          NAME="pips-life-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          SHA=$(cut -d' ' -f1 "$NAME.sha256")
          printf '{"app":"Pips-life","versionName":"%s","versionCode":%s,"tag":"%s","apk":"%s","sha256":"%s"}\n' "${{ steps.version.outputs.version_name }}" "${{ steps.version.outputs.version_code }}" "${{ steps.version.outputs.tag }}" "$NAME" "$SHA" > release-manifest.json
      - name: Verify release numbering
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          gh release list --limit 1 --json tagName > /tmp/latest-release.json
          python3 - <<'PY'
          import json, os, re, subprocess
          rows=json.load(open('/tmp/latest-release.json'))
          if not rows:
              raise SystemExit(0)
          tag=rows[0]['tagName']
          names=subprocess.check_output(['gh','release','view',tag,'--json','assets','-q','.assets[]?.name'],text=True).splitlines()
          codes=[]
          for name in names:
              m=re.search(r'pips-life-[0-9]+\.[0-9]+\.[0-9]+-(\d+)\.apk$',name)
              if m:
                  codes.append(int(m.group(1)))
          if codes and int(os.environ['VERSION_CODE']) <= max(codes):
              raise SystemExit(f"versionCode {os.environ['VERSION_CODE']} must exceed previous release code {max(codes)}")
          PY
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pips-life-signed-release
          path: |
            pips-life-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk
            pips-life-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk.sha256
            release-manifest.json
          if-no-files-found: error

  publish:
    name: Publish progressive GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download signed release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pips-life-signed-release
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.release.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$TAG" \
            release/pips-life-${{ needs.release.outputs.version }}-${{ needs.release.outputs.version_code }}.apk \
            release/pips-life-${{ needs.release.outputs.version }}-${{ needs.release.outputs.version_code }}.apk.sha256 \
            release/release-manifest.json \
            --title "Pips-life ${{ needs.release.outputs.version }} (${{ needs.release.outputs.version_code }})" \
            --notes "Version: ${{ needs.release.outputs.version }}\nVersionCode: ${{ needs.release.outputs.version_code }}\n\nOfficial Pips-life Android release. The app checks this GitHub Releases feed for newer versions." \
            --target "${GITHUB_SHA}"
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json tagName,name,assets
