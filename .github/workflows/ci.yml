name: Strat.1 Android + Python + Web CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_DIR: mobile

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'

      - name: Run complete Python test suite
        run: python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Next.js production build
        run: npm run build

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize Android PNG resources for AAPT2 release packaging
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e
          command -v convert >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y imagemagick)
          find app/src/main/res -type f -iname '*.png' -print0 | while IFS= read -r -d '' file; do
            tmp="${file}.normalized.png"
            convert "$file" -strip "$tmp"
            mv "$tmp" "$file"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore release signing material
        env:
          KEYSTORE_B64: ${{ secrets.PIPS_LIFE_KEYSTORE_B64 }}
        run: |
          set -e
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pips-life-release.jks"

      - name: Build debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        env:
          FLASHALPHA_API_KEY: ${{ secrets.FLASHALPHA_API_KEY }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Build signed release APK
        working-directory: ${{ env.ANDROID_DIR }}
        env:
          FLASHALPHA_API_KEY: ${{ secrets.FLASHALPHA_API_KEY }}
          PIPS_LIFE_KEYSTORE_PATH: ${{ runner.temp }}/pips-life-release.jks
          PIPS_LIFE_KEYSTORE_PASSWORD: ${{ secrets.PIPS_LIFE_KEYSTORE_PASSWORD }}
          PIPS_LIFE_KEY_ALIAS: ${{ secrets.PIPS_LIFE_KEY_ALIAS }}
          PIPS_LIFE_KEY_PASSWORD: ${{ secrets.PIPS_LIFE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify release artifact
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/apk/debug/app-debug.apk
          apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: strat1-apks-${{ github.sha }}
          path: |
            mobile/app/build/outputs/apk/release/app-release.apk
            mobile/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: strat1-apks-${{ github.sha }}
          path: dist

      - name: Publish v2.73 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view v2.73 >/dev/null 2>&1 || gh release create v2.73 --title "Pips-life v2.73" --notes "Stability-hardened Strategy 001 build"
          gh release upload v2.73 dist/app-release.apk dist/app-debug.apk --clobber
