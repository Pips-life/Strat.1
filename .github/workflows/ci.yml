name: Pips-life CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pips-life-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - name: Validate live runner syntax
        run: python -m py_compile runner/server.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build and verify debug APK
        working-directory: mobile
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/pips-badging.txt
          grep -q "package: name='life.pipslife.mobile'" /tmp/pips-badging.txt
          grep -q "application-label:'Pips-life'" /tmp/pips-badging.txt
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: pips-life-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish:
    name: Publish progressive GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, backend, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: pips-life-apk
          path: release
      - name: Calculate next release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' --sort=-version:refname | head -n1)"
          if [[ -z "$latest" ]]; then
            next="0.1.0"
          else
            current="${latest#v}"
            IFS=. read -r major minor patch <<< "$current"
            major="${major:-0}"
            minor="${minor:-0}"
            patch="${patch:-0}"
            next="${major}.${minor}.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
      - name: Rename APK
        run: mv release/app-debug.apk "release/pips-life-${{ steps.version.outputs.version }}.apk"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            "release/pips-life-${{ steps.version.outputs.version }}.apk" \
            --title "Pips-life ${{ steps.version.outputs.version }}" \
            --generate-notes
