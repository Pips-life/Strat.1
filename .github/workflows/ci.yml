name: Strat.1 Android + Python + Web CI
# Release pipeline: push-to-main and manual dispatch must build v2.81.
# Build release trigger verification.
# v2.81 trigger after Strategy 006 cache/zones update.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_DIR: mobile

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Run complete Python test suite
        run: python -m pytest -q
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Next.js production build
        run: npm run build

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Restore release signing material
        env:
          KEYSTORE_B64: ${{ secrets.PIPS_LIFE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pips-life-release.jks"
          test -s "$RUNNER_TEMP/pips-life-release.jks"
      - name: Build debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        env:
          FLASHALPHA_API_KEY: ${{ secrets.FLASHALPHA_API_KEY }}
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug
      - name: Build signed release APK
        working-directory: ${{ env.ANDROID_DIR }}
        env:
          FLASHALPHA_API_KEY: ${{ secrets.FLASHALPHA_API_KEY }}
          PIPS_LIFE_KEYSTORE_PATH: ${{ runner.temp }}/pips-life-release.jks
          PIPS_LIFE_KEYSTORE_PASSWORD: ${{ secrets.PIPS_LIFE_KEYSTORE_PASSWORD }}
          PIPS_LIFE_KEY_ALIAS: ${{ secrets.PIPS_LIFE_KEY_ALIAS }}
          PIPS_LIFE_KEY_PASSWORD: ${{ secrets.PIPS_LIFE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FLASHALPHA_API_KEY"
          test -n "$PIPS_LIFE_KEYSTORE_PASSWORD"
          test -n "$PIPS_LIFE_KEY_ALIAS"
          test -n "$PIPS_LIFE_KEY_PASSWORD"
          ./gradlew --no-daemon --stacktrace assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/pips-release-badging.txt
          grep -q "package: name='life.pipslife.mobile'" /tmp/pips-release-badging.txt
          grep -q "application-label:'Pips-life'" /tmp/pips-release-badging.txt
          grep -q "versionCode='81'" /tmp/pips-release-badging.txt
          grep -q "versionName='0.2.81'" /tmp/pips-release-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "$RUNNER_TEMP/pips-life-0.2.81-81.apk"
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pips-life-v0.2.81-build81
          path: ${{ runner.temp }}/pips-life-0.2.81-81.apk
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(grep '^versionName=' mobile/release.properties | cut -d= -f2)"
          version_code="$(grep '^versionCode=' mobile/release.properties | cut -d= -f2)"
          test "$version_name" = "0.2.81"
          test "$version_code" = "81"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v$version_name" >> "$GITHUB_OUTPUT"
      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: pips-life-v0.2.81-build81
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version_name }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          APK="release/pips-life-0.2.81-81.apk"
          test -s "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Pips-life v$VERSION" --generate-notes
          fi

# v2.81 rebuild trigger for Strategy 006 options-file caching and zone display.
