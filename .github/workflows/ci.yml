name: Pips-life Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pips-life-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate requested release version
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep '^versionName=' release.properties | cut -d= -f2)" = "0.2.72"
          test "$(grep '^versionCode=' release.properties | cut -d= -f2)" = "72"

      - name: Build debug APK and compile-check UI
        working-directory: mobile
        env:
          FLASHALPHA_API_KEY: ${{ secrets.FLASHALPHA_API_KEY }}
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/pips-debug-badging.txt
          grep -q "package: name='life.pipslife.mobile'" /tmp/pips-debug-badging.txt
          grep -q "application-label:'Pips-life'" /tmp/pips-debug-badging.txt

      - name: Prepare release signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.PIPS_LIFE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pips-life-release.keystore"
          test -s "$RUNNER_TEMP/pips-life-release.keystore"

      - name: Build signed release APK
        working-directory: mobile
        env:
          FLASHALPHA_API_KEY: ${{ secrets.FLASHALPHA_API_KEY }}
          PIPS_LIFE_KEYSTORE_PATH: ${{ runner.temp }}/pips-life-release.keystore
          PIPS_LIFE_KEYSTORE_PASSWORD: ${{ secrets.PIPS_LIFE_KEYSTORE_PASSWORD }}
          PIPS_LIFE_KEY_ALIAS: ${{ secrets.PIPS_LIFE_KEY_ALIAS }}
          PIPS_LIFE_KEY_PASSWORD: ${{ secrets.PIPS_LIFE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FLASHALPHA_API_KEY"
          test -n "$PIPS_LIFE_KEYSTORE_PASSWORD"
          test -n "$PIPS_LIFE_KEY_ALIAS"
          test -n "$PIPS_LIFE_KEY_PASSWORD"
          gradle --no-daemon assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/pips-release-badging.txt
          grep -q "package: name='life.pipslife.mobile'" /tmp/pips-release-badging.txt
          grep -q "application-label:'Pips-life'" /tmp/pips-release-badging.txt
          grep -q "versionCode='72'" /tmp/pips-release-badging.txt
          grep -q "versionName='0.2.72'" /tmp/pips-release-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "$RUNNER_TEMP/pips-life-0.2.72-72.apk"

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pips-life-v0.2.72-build72
          path: ${{ runner.temp }}/pips-life-0.2.72-72.apk
          if-no-files-found: error

  release:
    name: Publish v2.72 release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(grep '^versionName=' mobile/release.properties | cut -d= -f2)"
          version_code="$(grep '^versionCode=' mobile/release.properties | cut -d= -f2)"
          test "$version_name" = "0.2.72"
          test "$version_code" = "72"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v$version_name" >> "$GITHUB_OUTPUT"

      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: pips-life-v0.2.72-build72
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version_name }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          APK="release/pips-life-0.2.72-72.apk"
          test -s "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Pips-life v$VERSION" --generate-notes
          fi
