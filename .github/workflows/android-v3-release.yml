name: Android v2.102 Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Build release APK
        working-directory: mobile
        env:
          FLASHALPHA_API_KEY: ${{ secrets.FLASHALPHA_API_KEY }}
          PIPS_LIFE_KEYSTORE_PATH: ${{ secrets.PIPS_LIFE_KEYSTORE_PATH }}
          PIPS_LIFE_KEYSTORE_PASSWORD: ${{ secrets.PIPS_LIFE_KEYSTORE_PASSWORD }}
          PIPS_LIFE_KEY_ALIAS: ${{ secrets.PIPS_LIFE_KEY_ALIAS }}
          PIPS_LIFE_KEY_PASSWORD: ${{ secrets.PIPS_LIFE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          set -e
          find mobile/app/build/outputs -type f -name "*.apk" -print
          APK_PATH="$(find mobile/app/build/outputs -type f -name "*.apk" | head -n 1)"
          test -n "$APK_PATH"
          NORMALIZED_APK="mobile/app/build/outputs/apk/release/pips-life-2.102.0-2102.apk"
          cp "$APK_PATH" "$NORMALIZED_APK"
          echo "path=$NORMALIZED_APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK
        run: test -f "${{ steps.apk.outputs.path }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PipsLife-v2.102
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v2.102 --yes 2>/dev/null || true
          gh release create v2.102 "${{ steps.apk.outputs.path }}" --title "PipsLife v2.102" --generate-notes
