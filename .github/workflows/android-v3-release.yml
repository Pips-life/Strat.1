name: Pips-life Android Release

on:
  push:
    branches: [ main ]

concurrency:
  group: pips-life-android-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Restore production signing keystore
        env:
          PIPS_LIFE_KEYSTORE_BASE64: ${{ secrets.PIPS_LIFE_KEYSTORE_BASE64 }}
          PIPS_LIFE_KEYSTORE_PATH: ${{ secrets.PIPS_LIFE_KEYSTORE_PATH }}
        run: |
          set -euo pipefail
          if [ -n "$PIPS_LIFE_KEYSTORE_BASE64" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/pips-life-production.keystore"
            printf '%s' "$PIPS_LIFE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
          else
            KEYSTORE_PATH="$PIPS_LIFE_KEYSTORE_PATH"
            test -n "$KEYSTORE_PATH"
            test -f "$KEYSTORE_PATH"
          fi
          echo "PIPS_LIFE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Verify release signing inputs
        env:
          PIPS_LIFE_KEYSTORE_PASSWORD: ${{ secrets.PIPS_LIFE_KEYSTORE_PASSWORD }}
          PIPS_LIFE_KEY_ALIAS: ${{ secrets.PIPS_LIFE_KEY_ALIAS }}
          PIPS_LIFE_KEY_PASSWORD: ${{ secrets.PIPS_LIFE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PIPS_LIFE_KEYSTORE_PATH"
          test -f "$PIPS_LIFE_KEYSTORE_PATH"
          test -n "$PIPS_LIFE_KEYSTORE_PASSWORD"
          test -n "$PIPS_LIFE_KEY_ALIAS"
          test -n "$PIPS_LIFE_KEY_PASSWORD"

      - name: Read release version
        id: version
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep '^versionName=' mobile/release.properties | cut -d= -f2)"
          VERSION_CODE="$(grep '^versionCode=' mobile/release.properties | cut -d= -f2)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: mobile
        env:
          FLASHALPHA_API_KEY: ${{ secrets.FLASHALPHA_API_KEY }}
          PIPS_LIFE_KEYSTORE_PATH: ${{ env.PIPS_LIFE_KEYSTORE_PATH }}
          PIPS_LIFE_KEYSTORE_PASSWORD: ${{ secrets.PIPS_LIFE_KEYSTORE_PASSWORD }}
          PIPS_LIFE_KEY_ALIAS: ${{ secrets.PIPS_LIFE_KEY_ALIAS }}
          PIPS_LIFE_KEY_PASSWORD: ${{ secrets.PIPS_LIFE_KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --no-daemon --no-build-cache

      - name: Locate APK
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          APK_PATH="mobile/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          NORMALIZED_APK="mobile/app/build/outputs/apk/release/pips-life-$VERSION_NAME-$VERSION_CODE.apk"
          cp "$APK_PATH" "$NORMALIZED_APK"
          echo "path=$NORMALIZED_APK" >> "$GITHUB_OUTPUT"

      - name: Verify signed APK and production signing identity (known-good v2.119 baseline)
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"
          "$APKSIGNER" verify --verbose "$APK_PATH"
          "$ZIPALIGN" -c -v 4 "$APK_PATH"
          "$APKSIGNER" verify --print-certs "$APK_PATH" | tee "$RUNNER_TEMP/current-certs.txt"

          mkdir -p "$RUNNER_TEMP/previous-release"
          gh release download v2.119 --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$RUNNER_TEMP/previous-release"
          PREVIOUS_APK="$(find "$RUNNER_TEMP/previous-release" -type f -name '*.apk' | head -n 1)"
          test -n "$PREVIOUS_APK"
          "$APKSIGNER" verify --print-certs "$PREVIOUS_APK" | tee "$RUNNER_TEMP/previous-certs.txt"

          CURRENT_CERT="$(grep -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/current-certs.txt" | sed 's/.*: //')"
          PREVIOUS_CERT="$(grep -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/previous-certs.txt" | sed 's/.*: //')"
          test -n "$CURRENT_CERT"
          test -n "$PREVIOUS_CERT"
          test "$CURRENT_CERT" = "$PREVIOUS_CERT"

      - name: Verify APK metadata
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          EXPECTED_VERSION_NAME: ${{ steps.version.outputs.name }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -n "$AAPT2"
          BADGING="$("$AAPT2" dump badging "$APK_PATH")"
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='life.pipslife.mobile' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'"

      - name: Create SHA-256 checksum
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: sha256sum "$APK_PATH" > "$APK_PATH.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PipsLife-v${{ steps.version.outputs.name }}
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          TAG="v$VERSION_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" "${{ steps.apk.outputs.path }}.sha256" --clobber
          else
            gh release create "$TAG" "${{ steps.apk.outputs.path }}" "${{ steps.apk.outputs.path }}.sha256" --title "PipsLife v$VERSION_NAME" --generate-notes
          fi

          APK_COUNT="$(gh release view "$TAG" --json assets --jq '[.assets[] | select(.name | endswith(".apk"))] | length')"
          test "$APK_COUNT" -eq 1
