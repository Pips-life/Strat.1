name: Android v2.103 Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Restore production signing keystore
        env:
          PIPS_LIFE_KEYSTORE_BASE64: ${{ secrets.PIPS_LIFE_KEYSTORE_BASE64 }}
          PIPS_LIFE_KEYSTORE_PATH: ${{ secrets.PIPS_LIFE_KEYSTORE_PATH }}
        run: |
          set -euo pipefail
          if [ -n "$PIPS_LIFE_KEYSTORE_BASE64" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/pips-life-production.keystore"
            printf '%s' "$PIPS_LIFE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
          else
            KEYSTORE_PATH="$PIPS_LIFE_KEYSTORE_PATH"
            test -n "$KEYSTORE_PATH"
            test -f "$KEYSTORE_PATH"
          fi
          echo "PIPS_LIFE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Verify release signing inputs
        env:
          PIPS_LIFE_KEYSTORE_PASSWORD: ${{ secrets.PIPS_LIFE_KEYSTORE_PASSWORD }}
          PIPS_LIFE_KEY_ALIAS: ${{ secrets.PIPS_LIFE_KEY_ALIAS }}
          PIPS_LIFE_KEY_PASSWORD: ${{ secrets.PIPS_LIFE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PIPS_LIFE_KEYSTORE_PATH"
          test -f "$PIPS_LIFE_KEYSTORE_PATH"
          test -n "$PIPS_LIFE_KEYSTORE_PASSWORD"
          test -n "$PIPS_LIFE_KEY_ALIAS"
          test -n "$PIPS_LIFE_KEY_PASSWORD"

      - name: Build release APK
        working-directory: mobile
        env:
          FLASHALPHA_API_KEY: ${{ secrets.FLASHALPHA_API_KEY }}
          PIPS_LIFE_KEYSTORE_PATH: ${{ env.PIPS_LIFE_KEYSTORE_PATH }}
          PIPS_LIFE_KEYSTORE_PASSWORD: ${{ secrets.PIPS_LIFE_KEYSTORE_PASSWORD }}
          PIPS_LIFE_KEY_ALIAS: ${{ secrets.PIPS_LIFE_KEY_ALIAS }}
          PIPS_LIFE_KEY_PASSWORD: ${{ secrets.PIPS_LIFE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          APK_PATH="mobile/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          NORMALIZED_APK="mobile/app/build/outputs/apk/release/pips-life-2.103.0-2103.apk"
          cp "$APK_PATH" "$NORMALIZED_APK"
          echo "path=$NORMALIZED_APK" >> "$GITHUB_OUTPUT"

      - name: Verify signed APK
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK_PATH"
          "$APKSIGNER" verify --print-certs "$APK_PATH"

      - name: Verify APK metadata
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -n "$AAPT2"
          "$AAPT2" dump badging "$APK_PATH" | grep -F "package: name='life.pipslife.mobile' versionCode='2103' versionName='2.103'"

      - name: Create SHA-256 checksum
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: sha256sum "$APK_PATH" > "$APK_PATH.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PipsLife-v2.103
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v2.103 --yes 2>/dev/null || true
          gh release create v2.103 \
            "${{ steps.apk.outputs.path }}" \
            "${{ steps.apk.outputs.path }}.sha256" \
            --title "PipsLife v2.103" \
            --generate-notes
