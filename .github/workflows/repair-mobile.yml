name: Repair mobile Kotlin build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair generated Kotlin expression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile/app/src/main/java/life/pips/strat1/MainActivity.kt')
          s = p.read_text()
          old = 'val statusText=when{running->"RUNNING";starting->raw.replace(\'_\',\' \');failed->raw.replace(\'_\',\' \');raw.isBlank()->"NOT CONNECTED";else->raw.replace(\'_\',\' \')} '
          if old in s:
              s=s.replace(old, 'val statusText=when { running -> "RUNNING"; starting -> raw.replace(\'_\', \' \'); failed -> raw.replace(\'_\', \' \'); raw.isBlank() -> "NOT CONNECTED"; else -> raw.replace(\'_\', \' \') } ')
          else:
              import re
              pattern=r'val statusText=when\{running->"RUNNING";starting->raw\.replace\(\'_\',\' \'\);failed->raw\.replace\(\'_\',\' \'\);raw\.isBlank\(\)->"NOT CONNECTED";else->raw\.replace\(\'_\',\' \'\)\}'
              s,n=re.subn(pattern, 'val statusText=when { running -> "RUNNING"; starting -> raw.replace(\'_\', \' \'); failed -> raw.replace(\'_\', \' \'); raw.isBlank() -> "NOT CONNECTED"; else -> raw.replace(\'_\', \' \') }', s, count=1)
              if n == 0:
                  raise SystemExit('Target Kotlin expression not found; no change made')
          p.write_text(s)
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/app/src/main/java/life/pips/strat1/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No repair needed"
          else
            git commit -m "fix(mobile): repair bot status Kotlin expression"
            git push origin main
          fi
